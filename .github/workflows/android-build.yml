name: Cassandra Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Apktool
        run: |
          curl -fL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /tmp/apktool
          chmod +x /tmp/apktool
          echo /tmp >> "$GITHUB_PATH"
      - name: Verify required inputs
        shell: bash
        run: |
          test -f project/BUILD-TEST.sh
          test -f project/decoded/assets/cassr/cassr_watch_v2
          test -n "${{ secrets.CASSANDRA_KEYSTORE_B64 }}"
          test -n "${{ secrets.CASSANDRA_STORE_PASS }}"
      - name: Restore signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.CASSANDRA_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.CASSANDRA_STORE_PASS }}
        run: |
          mkdir -p private-signing
          chmod 700 private-signing
          printf '%s' "$KEY_B64" | base64 -d > private-signing/cassandra-release.p12
          chmod 600 private-signing/cassandra-release.p12
          printf '%s' "$KEY_PASS" > private-signing/store.pass
          chmod 600 private-signing/store.pass
      - name: Build
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          CASSANDRA_SIGNING_DIR: ${{ github.workspace }}/private-signing
        run: bash project/BUILD-TEST.sh
      - name: Record APK hashes
        if: success()
        run: find project/build -name '*.apk' -type f -exec sha256sum '{}' '+' > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cassandra-apk
          path: |
            project/build/**/*.apk
            apk-sha256.txt
